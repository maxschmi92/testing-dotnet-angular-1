name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # Hard cap so a hung step (e.g. a stalled browser/apt download) fails in
    # minutes instead of burning to GitHub's 6-hour job ceiling.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Derive NX_BASE / NX_HEAD for `nx affected` (no Nx Cloud).
      - uses: nrwl/nx-set-shas@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Skip husky in CI.
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore

      # Cache the Playwright browser bundle across runs — the cold download is
      # what once stalled CI. On a cache hit the install is near-instant.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      # Chromium only — matches the trimmed Playwright configs.
      - run: npx playwright install --with-deps chromium

      - run: npx nx format:check
      - run: npx nx affected -t lint test build e2e
