name: Deploy (Azure)

# Promotion pipeline. Every push to main (after CI validates the same commit)
# builds the artifacts ONCE, then promotes that exact build through environments:
#
#   build ──▶ staging (auto) ──▶ production (manual approval gate)
#
# The gate is a "Required reviewers" rule on the `production` GitHub Environment —
# see infra/azure/README.md ("Environments & promotion") for the one-time setup.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  # Build the API image + both SPA bundles ONCE. Downstream environments promote
  # these exact artifacts — nothing is rebuilt per environment, only reconfigured.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Image ref
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ada1" >>"$GITHUB_OUTPUT"

      # --- API image → GHCR (immutable :sha tag is what gets promoted) ---
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:${{ github.sha }}

      # --- SPA bundles (built once; each env stamps its own config.json at deploy) ---
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx nx build admin
      - run: npx nx build client
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist/apps/admin/browser
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: dist/apps/client/browser

  # Auto-promote the fresh build to staging.
  staging:
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
      image: ${{ needs.build.outputs.image }}
      image_tag: ${{ github.sha }}
    secrets: inherit

  # Promote the SAME build to production — but only after staging succeeds and a
  # human approves the `production` environment (its Required-reviewers rule blocks
  # these jobs until then).
  production:
    needs: staging
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      image: ${{ needs.build.outputs.image }}
      image_tag: ${{ github.sha }}
    secrets: inherit
